<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pipeFit examples</title>
<meta name="description" content="Bins that pipeFit reconstructed: real camera scans and simulation. Tap a picture to turn the 3-D result.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
:root{--bg:#FAFAF7;--card:#FFFFFF;--line:#E3E5E8;--ink:#1A1C20;--ink2:#3D4249;--ink3:#5B6068;--accent:#A8481A;--blue:#1F5FA8;--img:#EEF0F2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 48px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
header img{height:46px;width:auto}
h1{font-family:"Space Grotesk",Inter,sans-serif;font-size:30px;margin:0;letter-spacing:-.3px}
h1 span{color:var(--accent)}
.back{margin-left:auto;font-size:14px;color:var(--ink3)}
a{color:var(--accent)}
h2{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tile{position:relative;display:block;padding:0;border:0;border-radius:12px;overflow:hidden;background:var(--img);cursor:pointer;aspect-ratio:16/9;box-shadow:0 1px 2px rgba(26,28,32,.08);transition:transform .15s,box-shadow .15s}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 7px;background:linear-gradient(transparent,rgba(26,28,32,.72));color:#fff;font-size:13px;font-weight:600;text-align:left}
.tile:hover,.tile:focus-visible{transform:translateY(-2px);box-shadow:0 0 0 3px var(--accent),0 8px 20px rgba(26,28,32,.18);outline:none}
.tile .d3{position:absolute;top:8px;right:8px;padding:2px 8px;border-radius:999px;background:rgba(26,28,32,.7);color:#fff;font-size:11.5px;font-weight:700;font-style:normal}
dialog{border:0;padding:0;border-radius:14px;width:min(1100px,96vw);max-height:94vh;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(20,22,26,.6)}
.dlg{display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar b{font-size:15px;margin-right:auto}
.bar button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.bar .x{border:0;font-size:22px;line-height:1;padding:2px 8px;background:transparent}
model-viewer{width:100%;height:min(70vh,640px);background:#eef1f4;--poster-color:transparent;--progress-bar-color:#4C78A8}
.photo{display:none;width:100%;height:min(70vh,640px);object-fit:contain;background:#111}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);padding:8px 12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<main class="wrap">
<header>
<img src="../assets/university-west-logo.png" width="700" height="380" alt="University West">
<h1>pipeFit <span>examples</span></h1>
<span class="back"><a href="../">&larr; pipeFit digital poster</a> &nbsp;&middot;&nbsp; <a href="../wara/">&larr; WARA Team HVäst</a></span>
</header>

<h2>Real scans</h2>
<div class="grid" id="real"></div>
<h2>Simulation</h2>
<div class="grid" id="sim"></div>
</main>

<dialog id="dlg" aria-labelledby="dlg-title">
<div class="dlg">
<div class="bar"><b id="dlg-title"></b><span id="modes"></span><button class="x" id="close" type="button" aria-label="Close">&times;</button></div>
<model-viewer id="mv" camera-controls touch-action="pan-y" interaction-prompt="none" shadow-intensity="0.6" exposure="1.05" alt="3-D result"></model-viewer>
<img class="photo" id="ph" alt="">
<div class="legend"><span><i style="background:#4C78A8"></i>type AB</span><span><i style="background:#F58518"></i>type X</span><span><i style="background:#54A24B"></i>type Y</span><span><i style="background:#9AA0A8"></i>fittings / parts</span><span>Drag to turn, pinch or scroll to zoom</span></div>
</div>
</dialog>

<script>
(async function () {
  const m = await fetch('data/manifest.json').then(r => r.json());
  const dlg = document.getElementById('dlg'), mv = document.getElementById('mv'), ph = document.getElementById('ph'),
        modes = document.getElementById('modes'), title = document.getElementById('dlg-title');
  function short(e) { return (e.bin_short || '') + ' · ' + String(e.contents || '').split(':')[0].split(',')[0].replace(/\s*\(.*\)/, ''); }
  function show(which, e) {
    for (const b of modes.querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.k === which));
    if (which === '3d') { mv.style.display = 'block'; ph.style.display = 'none'; }
    else { const p = e.photos[+which]; ph.src = p.src; ph.alt = p.caption || ''; ph.style.display = 'block'; mv.style.display = 'none'; }
  }
  function open(e) {
    title.textContent = e.title;
    mv.src = e.glb;
    modes.innerHTML = '';
    const opts = [['3d', '3-D']].concat((e.photos || []).map((p, i) => [String(i), (e.kind === 'real' ? 'Photo ' : 'Picture ') + (i + 1)]));
    for (const [k, label] of opts) {
      const b = document.createElement('button'); b.type = 'button'; b.dataset.k = k; b.textContent = label;
      b.addEventListener('click', () => show(k, e)); modes.appendChild(b);
    }
    show('3d', e);
    dlg.showModal();
  }
  for (const e of m.examples) {
    const t = document.createElement('button');
    t.type = 'button'; t.className = 'tile'; t.setAttribute('aria-label', e.title + ' (open the 3-D result)');
    const img = document.createElement('img');
    img.src = (e.photos && e.photos[0] ? e.photos[0].src : e.thumb); img.alt = e.title; img.loading = 'lazy';
    const cap = document.createElement('span'); cap.textContent = short(e);
    const d3 = document.createElement('em'); d3.className = 'd3'; d3.textContent = '3-D';
    t.append(img, cap, d3);
    t.addEventListener('click', () => open(e));
    document.getElementById(e.kind === 'real' ? 'real' : 'sim').appendChild(t);
  }
  document.getElementById('close').addEventListener('click', () => dlg.close());
  dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });
  dlg.addEventListener('close', () => { mv.removeAttribute('src'); });
})();
</script>
</body>
</html>
